[connection]
host = "192.168.0.10"
port = 22
username = "root"
password = "xxxxxx"
timeout = 20
use_sudo = false
# sudo_password = "change_me_if_needed"

[database]
name = "ukmclient"
password = "CtHDbCGK.C"

[paths]
dbrepair_archive = "dist/dbrepair6700+.tgz"
empty_datadir_archive = "dist/mysql5-datadir-empty_46+.tgz"
local_backup_dir = "backups"
remote_tmp_dir = "/tmp"
# remote_dbrepair_dir_name = "dbrepair6700+"
remote_mysql_dir = "/usr/local/mysql"
remote_mysql_var_dir = "/usr/local/mysql/var"
remote_mysql_backup_name = "mysql-db.tgz"
remote_my_cnf = "/etc/my.cnf"
remote_dump_filename = "ukmclient.sql"

[services]
mysql_stop = "/etc/init.d/mysql stop"
mysql_start = "/etc/init.d/mysql start"
ukmclient_stop = "/etc/init.d/ukmclient stop"
ukmclient_start = "/etc/init.d/ukmclient start"

[tspiot]
# Каталог установки на кассе: /usr/local/ukmclient или /usr/local/lillo
# (в GUI можно переключать и определять по IP).
target_base = "/usr/local/ukmclient"
data_dir_name = "data_tspiot"
binary_name = "tspiot"
gismt_cert_name = "gismt_cert.txt"
# По умолчанию владелец вычисляется из имени каталога (ukmclient -> ukmclient:ukmclient).
# owner = "ukmclient:ukmclient"

[distribution]
# Источник дистрибутивов ТС ПИоТ. Выберите ОДИН из вариантов:
# 1) HTTP-сервер — касса качает файлы напрямую по curl/wget:
base_url = "http://192.168.20.229/UKM/"
# 2) Локальный каталог — утилита заливает файлы на кассу по SFTP
#    (путь относительно этого config.toml или абсолютный). Если задан local_dir,
#    он имеет приоритет над base_url:
# local_dir = "dist/UKM"

[publish]
# Доступ к веб-серверу для публикации драйверов (вкладка «Публикация драйвера»).
# Пароль можно не хранить здесь: он запрашивается перед публикацией,
# с галочкой «Сохранить в config.toml».
host = "192.168.20.229"
port = 22
username = "root"
# password = "xxxxxx"
ukm_dir = "/var/www/files/UKM"
owner = "www-data:www-data"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbrepair"
version = "0.1.0"
description = "CLI utility for automating DB repair on кассовые узлы via SSH/SFTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4,<4.0",
]

[project.scripts]
dbrepair = "dbrepair.cli:main"
dbrepair-gui = "dbrepair.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
